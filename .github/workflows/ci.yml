name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t backenddev:ci .

      - name: Smoke test Docker container
        run: |
          docker run -d \
            --name backenddev-ci \
            -e PORT=5000 \
            -p 127.0.0.1:5000:5000 \
            backenddev:ci

          PASSED=0
          for i in {1..15}; do
            if curl -fsS -o /dev/null http://127.0.0.1:5000/; then
              echo "✅ Smoke test passed! (attempt $i)"
              PASSED=1
              break
            fi

            echo "Waiting for application to become ready (attempt $i/15)..."
            sleep 2
          done

          if [ $PASSED -ne 1 ]; then
            echo "❌ Smoke test timed out or failed! Container logs:"
            docker logs backenddev-ci
            docker rm -f backenddev-ci || true
            exit 1
          fi

          # Clean up container
          docker rm -f backenddev-ci || true

        
  publish:
    name: Publish Docker image to GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag Docker image
        run: |
          docker build \
            -t ghcr.io/bsingh6636/backenddev:sha-${{ github.sha }} \
            .

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/bsingh6636/backenddev:sha-${{ github.sha }}

