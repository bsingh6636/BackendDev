
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
  
      - name: Build Docker image
        run: docker build -t backenddev:ci .

      
      - name: Smoke test Docker container
        run: |
          docker run -d \
            --name backenddev-ci \
            -e PORT=5000 \
            -p 127.0.0.1:5000:5000 \
            backenddev:ci

          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:5000/; then
              echo "Smoke test passed!"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          docker logs backenddev-ci
          exit 1


